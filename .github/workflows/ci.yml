name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is registered as a required status check on master. Do not rename it.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the Go version named in go.mod and caches modules and the build cache.
      # The cache key comes from go.mod until dependencies add a go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: go build ./...

      # The clipper's tests run ffmpeg and ffprobe when they are installed and
      # skip those parts otherwise. Installing them here makes CI run them.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Test
        run: go test -race ./...

      # Both binaries for linux/amd64 and linux/arm64 with CGO disabled, so ARM breakage is caught here.
      - name: Cross-compile
        run: make cross
