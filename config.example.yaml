# pogfarm example configuration.
#
# Copy this file to config.yaml and adjust it. config.yaml is git-ignored and
# must never be committed.
#
# Where the file is found: the -config flag, or the POGFARM_CONFIG environment
# variable. With neither, no file is read and everything comes from the
# defaults and the environment.
#
# Every key can be overridden by the environment variable named next to it.
# The environment wins over this file. An unknown key is an error.
#
# Secrets are shown here as the placeholder "change-me", which is rejected at
# startup so it cannot be used by accident. Replace it in your own config.yaml,
# or better, supply each secret through its environment variable or through
# <VARIABLE>_FILE naming a file that holds the value, which is how container
# secrets are mounted. Setting both the variable and its _FILE is an error.

# Main service. Runs once, on the main node.
pogfarm:
  # Address the job API listens on, as host:port.
  # Env: POGFARM_LISTEN_ADDR. Default ":8080".
  listen_addr: ":8080"

  # Directory for the SQLite file and the finished clips.
  # Env: POGFARM_DATA_DIR. Default "data".
  data_dir: "data"

  # Shared secret that clippers present to the job API. Required, at least
  # 16 characters, and the same value on every clipper.
  # Env: POGFARM_API_SECRET or POGFARM_API_SECRET_FILE.
  api_secret: "change-me"

  # Largest clip file a clipper may upload, in bytes. A larger upload is
  # rejected with payload_too_large.
  # Env: POGFARM_MAX_CLIP_BYTES. Default 268435456 (256 MiB).
  max_clip_bytes: 268435456

  # Job queue.
  queue:
    # How long a claimed job stays with its clipper without a heartbeat
    # before pogfarm takes it back. Clippers are told to send a heartbeat
    # four times per lease. A duration such as "90s" or "2m", at least "10s".
    # Env: POGFARM_QUEUE_LEASE_DURATION. Default "2m".
    lease_duration: "2m"

    # How many times a job is handed out before it is given up. A job whose
    # render failed, or whose lease expired, is queued again until it has
    # had this many attempts, and is then marked failed. At least 1.
    # Env: POGFARM_QUEUE_MAX_ATTEMPTS. Default 3.
    max_attempts: 3

    # How often pogfarm looks for jobs whose lease has expired, because
    # their clipper stopped sending heartbeats, and takes them back. A
    # duration such as "15s", at least "1s".
    # Env: POGFARM_QUEUE_REAPER_INTERVAL. Default "15s".
    reaper_interval: "15s"

  # When the files of finished clips are deleted from the data directory.
  # Clips pending review, and approved clips not yet posted to every target,
  # are never deleted. Leftover uploads are removed at startup, and files no
  # clip refers to are removed once they are an hour old.
  cleanup:
    # How often the cleanup runs. A duration such as "30m", at least "1m".
    # Env: POGFARM_CLEANUP_INTERVAL. Default "30m".
    interval: "30m"

    # How long the file of a rejected clip is kept after the rejection.
    # At least "1h".
    # Env: POGFARM_CLEANUP_REJECTED_RETENTION. Default "24h".
    rejected_retention: "24h"

    # How long the file of a clip that has been posted to every target is
    # kept after its last post. At least "1h".
    # Env: POGFARM_CLEANUP_POSTED_RETENTION. Default "168h" (7 days).
    posted_retention: "168h"

  # Twitch API credentials, from an application registered in the Twitch
  # developer console. pogfarm uses them to obtain an app access token.
  # Set both keys or neither.
  twitch:
    # Client id of the application. Not a secret, but the placeholder is
    # rejected like one.
    # Env: POGFARM_TWITCH_CLIENT_ID.
    client_id: "change-me"

    # Client secret of the application.
    # Env: POGFARM_TWITCH_CLIENT_SECRET or POGFARM_TWITCH_CLIENT_SECRET_FILE.
    client_secret: "change-me"

  # Telegram bot the owner reviews clips through. Optional: with neither key
  # set, pogfarm runs without the bot. Setting only one of them is an error.
  # telegram:
  #   # Token that BotFather issued for the bot. A secret.
  #   # Env: POGFARM_TELEGRAM_BOT_TOKEN or POGFARM_TELEGRAM_BOT_TOKEN_FILE.
  #   bot_token: "change-me"
  #
  #   # Id of the only chat the bot answers; everyone else is ignored. For a
  #   # private chat this is the owner's numeric Telegram user id.
  #   # Env: POGFARM_TELEGRAM_OWNER_CHAT_ID.
  #   owner_chat_id: 123456789

  # Approve and Reject buttons of the review messages.
  review:
    # How long after a decision the Undo button works, as long as no upload
    # of the clip has started. At most "1h", the shortest rejected_retention,
    # so a rejected clip's file is never deleted while it can still be undone.
    # Env: POGFARM_REVIEW_UNDO_WINDOW. Default "5m".
    undo_window: "5m"

  # TwitchDownloaderCLI program used to download the chat of a Twitch VOD:
  # a path, or a name looked up in PATH.
  # Env: POGFARM_TWITCH_DOWNLOADER_PATH. Default "TwitchDownloaderCLI".
  twitch_downloader_path: "TwitchDownloaderCLI"

  # Allowlist: the only streamers pogfarm processes. It never discovers
  # streamers by itself, so with no entries it finds no VODs. File only: this
  # list has no environment variable.
  # streamers:
  #     # Platform the streamer is on. "twitch" is the only one today.
  #   - platform: twitch
  #     # Account name, as in the channel URL.
  #     login: "some_streamer"
  #     # Optional, default true. false keeps the entry but stops new VODs of
  #     # the streamer from being recorded.
  #     enabled: true

  # How VODs of the allowlisted streamers are found.
  discovery:
    # A VOD that started longer ago than this is not recorded, because the
    # platform deletes VODs after a retention period.
    # Env: POGFARM_DISCOVERY_MAX_VOD_AGE. Default "72h".
    max_vod_age: "72h"

    # Time between two looks at the allowlisted streamers' VODs. The first
    # look is right at startup, after the allowlist is synced into the
    # database.
    # Env: POGFARM_DISCOVERY_INTERVAL. Default "15m".
    interval: "15m"

  # Scanner: downloads the chat of each recorded VOD, finds the moments worth
  # clipping and queues their render jobs. Runs only when the Twitch
  # credentials are set.
  scan:
    # How long the scanner waits, when no VOD is due, before it looks again.
    # Env: POGFARM_SCAN_INTERVAL. Default "1m".
    interval: "1m"

    # How many VODs are scanned at the same time.
    # Env: POGFARM_SCAN_WORKERS. Default 1.
    workers: 1

    # How many scans of one VOD are started before it is given up. A VOD the
    # platform no longer has is given up at once.
    # Env: POGFARM_SCAN_MAX_ATTEMPTS. Default 5.
    max_attempts: 5

    # Wait before the first retry of a failed scan. It doubles with every
    # further failure, up to max_retry_backoff.
    # Env: POGFARM_SCAN_RETRY_BACKOFF. Default "10m".
    retry_backoff: "10m"
    # Env: POGFARM_SCAN_MAX_RETRY_BACKOFF. Default "6h".
    max_retry_backoff: "6h"

    # The two signals that pick moments to clip. A signal that is off is
    # skipped entirely. At least one must be on.
    # Bursts of chat activity. Off: the chat is not downloaded, so
    # TwitchDownloaderCLI is not needed.
    # Env: POGFARM_SCAN_CHAT_SPIKES. Default true.
    chat_spikes: true
    # Clips viewers made of the VOD. Off: the platform is not asked for them.
    # Env: POGFARM_SCAN_VIEWER_CLIPS. Default true.
    viewer_clips: true

    # Chat spike detection. File only. The chat is cut into windows; a
    # window is flagged when it holds at least min_messages messages and
    # factor times the average of the windows within baseline around it.
    spike:
      window: "5s"
      baseline: "5m"
      factor: 3
      min_messages: 8
      # Flagged windows at most this far apart become one spike.
      merge_gap: "0s"
      # Ignore the start of each VOD, where chat greets the streamer.
      skip_start: "0s"
      # Messages with these emotes or words count this many times; 0 hides
      # them, which suits bot commands. Default: none.
      # weights:
      #   LUL: 2
      #   KEKW: 2
      #   "!song": 0

    # How spikes and viewer clips become clip windows. File only.
    candidates:
      # A spike's window runs from pre_roll before it to post_roll after
      # its peak; a viewer clip's is the clip with clip_padding each side.
      pre_roll: "25s"
      post_roll: "5s"
      clip_padding: "2s"
      min_length: "15s"
      max_length: "60s"
      # Only the best this many candidates of a VOD are rendered.
      max_per_vod: 5
      # Score of a viewer clip with no views; more views score more.
      viewer_clip_score: 3

  # Uploader: posts approved clips to the upload targets, one row per clip and
  # target. A clip is never posted twice: if pogfarm stops during an upload,
  # the target is asked whether the post exists where it can be, and
  # otherwise the owner is told to look by hand.
  upload:
    # The targets clips are posted to. File only. With no enabled target
    # nothing is posted. Default: none.
    # targets:
    #     # Target name, as stored in the database. Unique.
    #   - name: youtube
    #     # Optional, default true. false keeps the entry but posts nothing
    #     # more to it; approvals create no rows for it.
    #     enabled: true
    #     # Most posts in any 24 hours (a rolling window). At least 1.
    #     daily_cap: 5
    #     # Least time between two posts. "0s" for none.
    #     min_spacing: "2h"

    # How many uploads of one clip to one target are started before it is
    # given up. A permanent error gives up at once.
    # Env: POGFARM_UPLOAD_MAX_ATTEMPTS. Default 5.
    max_attempts: 5

    # Wait before the first retry of a failed upload. It doubles with every
    # further failure, up to max_retry_backoff.
    # Env: POGFARM_UPLOAD_RETRY_BACKOFF. Default "5m".
    retry_backoff: "5m"
    # Env: POGFARM_UPLOAD_MAX_RETRY_BACKOFF. Default "6h".
    max_retry_backoff: "6h"

    # How long the uploader waits between two looks at the pending uploads.
    # Env: POGFARM_UPLOAD_POLL_INTERVAL. Default "1m".
    poll_interval: "1m"

    # Longest one upload may take. One that runs out is treated like a crash
    # during the upload: it is not retried blindly.
    # Env: POGFARM_UPLOAD_ATTEMPT_TIMEOUT. Default "30m".
    attempt_timeout: "30m"

  # Title, description and tags of posted clips. File only. Patterns use
  # placeholders in braces: {streamer} (display name), {login}, {channel_url},
  # {hook} (a short line from the clip's transcript, or the streamer's name
  # when nobody speaks), {date} (the VOD's date, 2006-01-02), {vod_title}, and
  # in the description only {hashtags} ("#one #two"). Another name in braces
  # is an error. Each platform's length limits are enforced by cutting at a
  # word boundary; the credit line is added after the description and is
  # never cut. Replying to a clip's review message with a new title replaces
  # the generated title of that clip. The values shown are the defaults.
  # post:
  #   default:
  #     title: "{hook} | {streamer}"
  #     description: "{hook}\n\n{hashtags}"
  #     # With or without '#'. Placeholders allowed.
  #     hashtags: ["shorts", "{login}"]
  #     # Required.
  #     credit: "Credit: {streamer}, streamed live on {date}: {channel_url}"
  #   # Per-streamer overrides; a key left out takes the default's value.
  #   streamers:
  #     - platform: twitch
  #       login: "some_streamer"
  #       hashtags: ["shorts", "gaming", "{login}"]

# Render service. Runs on every node.
clipper:
  # Base URL of the pogfarm job API. Required.
  # Env: CLIPPER_POGFARM_URL.
  pogfarm_url: "http://localhost:8080"

  # Working directory for a job's files. Emptied after each job.
  # Env: CLIPPER_SCRATCH_DIR. Default "scratch".
  scratch_dir: "scratch"

  # Name shown for this clipper in pogfarm's queue and status output.
  # 1 to 63 letters, digits, dots, dashes or underscores.
  # Env: CLIPPER_NAME. Default: the machine's hostname.
  # name: "laptop-1"

  # Shared secret presented to pogfarm. Required, and it must match
  # pogfarm.api_secret.
  # Env: CLIPPER_API_SECRET or CLIPPER_API_SECRET_FILE.
  api_secret: "change-me"

  # How the clipper fetches the part of the stream a render asks for.
  download:
    # TwitchDownloaderCLI, which downloads a range of a Twitch VOD (1.56.5
    # is the tested version). A path, or a name looked up in PATH.
    # Env: CLIPPER_DOWNLOAD_TWITCH_DOWNLOADER_PATH. Default "TwitchDownloaderCLI".
    twitch_downloader_path: "TwitchDownloaderCLI"
    # ffmpeg and ffprobe, which trim the range to the exact start and end
    # and check the result.
    # Env: CLIPPER_DOWNLOAD_FFMPEG_PATH, CLIPPER_DOWNLOAD_FFPROBE_PATH.
    # Defaults "ffmpeg" and "ffprobe".
    ffmpeg_path: "ffmpeg"
    ffprobe_path: "ffprobe"
    # Twitch stream quality, as TwitchDownloaderCLI names it ("1080p60",
    # "720p60", ...). A VOD without that stream is downloaded in its best one.
    # Env: CLIPPER_DOWNLOAD_QUALITY. Default "1080p60".
    quality: "1080p60"
    # A download or trim is killed after timeout_base plus timeout_per_second
    # for every second of the requested range.
    # Env: CLIPPER_DOWNLOAD_TIMEOUT_BASE, CLIPPER_DOWNLOAD_TIMEOUT_PER_SECOND.
    # Defaults 2m and 5s.
    timeout_base: 2m
    timeout_per_second: 5s

  # Transcription: every spoken word with its start and end time, for the
  # captions. Done by WhisperX on CPU. The defaults match the clipper base
  # image, where the models are installed and nothing is downloaded at job
  # time.
  transcribe:
    # The WhisperX and ffmpeg programs: a path, or a name looked up in PATH.
    # Env: CLIPPER_TRANSCRIBE_WHISPERX_PATH, CLIPPER_TRANSCRIBE_FFMPEG_PATH.
    # Defaults "whisperx" and "ffmpeg".
    whisperx_path: "whisperx"
    ffmpeg_path: "ffmpeg"

    # Whisper model: a directory holding a CTranslate2 (faster-whisper)
    # model, or a model name already in the Hugging Face cache.
    # Env: CLIPPER_TRANSCRIBE_MODEL.
    # Default "/models/whisper/faster-whisper-small", the model in the image.
    model: "/models/whisper/faster-whisper-small"

    # Whisper language code of the speech. Required; there is no language
    # detection. Env: CLIPPER_TRANSCRIBE_LANGUAGE. Default "en".
    language: "en"

    # Languages whose alignment model is installed (the image has English
    # only). Aligned words get their own timing; for any other language each
    # sentence's time is split evenly across its words, and a warning is
    # logged. File only. Default [en].
    aligned_languages: ["en"]

    # CTranslate2 compute type: int8, float32 or default (float32 on CPU).
    # Env: CLIPPER_TRANSCRIBE_COMPUTE_TYPE. Default "int8".
    compute_type: "int8"

    # Limit for each tool run, the audio extraction and WhisperX.
    # Env: CLIPPER_TRANSCRIBE_TIMEOUT. Default 10m.
    timeout: 10m
